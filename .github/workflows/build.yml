name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # Needed so the release step can create a release and upload the DLL.
    # The repository default is read-only, which made every tag build fail.
    permissions:
      contents: write
    env:
      DLL_DIR: osu.Game.Rulesets.FPSosu/bin/Release/net10.0
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Upload ruleset DLL
        uses: actions/upload-artifact@v5
        with:
          name: osu.Game.Rulesets.FPSosu
          path: ${{ env.DLL_DIR }}/osu.Game.Rulesets.FPSosu.dll

      - name: Attach DLL to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          dll="$DLL_DIR/osu.Game.Rulesets.FPSosu.dll"

          # Releases are often published by hand before the tag is pushed,
          # so only create one when missing and otherwise refresh the asset.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dll" --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "$dll"
          fi
