name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Upload ruleset DLL
        uses: actions/upload-artifact@v4
        with:
          name: osu.Game.Rulesets.FPSosu
          path: osu.Game.Rulesets.FPSosu/bin/Release/net8.0/osu.Game.Rulesets.FPSosu.dll

      - name: Attach DLL to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}"
          --generate-notes
          osu.Game.Rulesets.FPSosu/bin/Release/net8.0/osu.Game.Rulesets.FPSosu.dll
